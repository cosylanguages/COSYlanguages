media:
  input: assets/images    # Or wherever your site currently stores uploaded images
  output: /assets/images

content:
  - name: blog
    label: Blog Posts
    type: collection
    path: blog            # The folder where your blog files are located
    format: html          # Change to 'md' if your posts are Markdown files
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: body
        label: Content
        type: rich-text   # Gives you the visual WYSIWYG editor like Blogger
