name: Export Stage Mode Video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Post slug to render into video'
        required: true
        default: 'stage-demo-podcast'
      audio:
        description: 'Optional path to audio narration file'
        required: false
        default: ''

jobs:
  export-video:
    name: Render Stage Mode MP4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install System Dependencies & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium Browser
        run: npx playwright install chromium --with-deps

      - name: Build Blog Index & Pages
        run: |
          node scripts/build-blog.js

      - name: Render Stage Mode Video
        run: |
          SLUG="${{ github.event.inputs.slug }}"
          AUDIO="${{ github.event.inputs.audio }}"
          if [ -n "$AUDIO" ]; then
            node scripts/export-stage-video.js "$SLUG" --audio "$AUDIO" --out dist/videos
          else
            node scripts/export-stage-video.js "$SLUG" --out dist/videos
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stage-video-${{ github.event.inputs.slug }}
          path: dist/videos/*.mp4
          if-no-files-found: error
