name: CI Link and HTML Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate JSON Schemas and Content Examples
        run: |
          node scripts/validate-schema.js

      - name: Verify Vocabulary Pool Minimum Thresholds
        run: |
          node scripts/verify_vocab_pool.js

      - name: Validate Public Entry Pages
        run: npx html-validate index.html login.html privacy.html placement-quiz.html

      - name: Run Grammar Logic Tests
        run: >-
          npx playwright test
          project/tests/adjective_architecture_validation.spec.ts
          project/tests/relational_architecture_validation.spec.ts
          --reporter=line

      - name: Check Canonical Footer Consistency
        run: |
          npm run check:footer

      - name: Check Founder Name Policy
        run: |
          npm run check:names

      - name: Report Existing HTML Issues (non-blocking)
        run: |
          npx html-validate "*.html" "practice/*.html" "games/*.html" "vocabulary/*.html" || true

      - name: Run internal link verification
        run: |
          python3 project/scripts/audits/link_checker.py
