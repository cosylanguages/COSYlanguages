name: CI Link and HTML Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate HTML templates/core
        run: |
          npx html-validate "*.html" "practice/*.html" "games/*.html" "vocabulary/*.html" "grammar/*.html" || true

      - name: Run internal link verification
        run: |
          python3 scripts/audits/link_checker.py
